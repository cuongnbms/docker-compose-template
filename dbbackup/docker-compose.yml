x-default: &default
  networks:
    - traefik-net
  # cpus: 0.5
  # mem_limit: 500M
  restart: unless-stopped
  # init: true
  # privileged: true
  # stdin_open: true
  # tty: true
  logging:
    driver: "json-file"
    options:
      max-size: "10M"
      max-file: "3"

networks:
  traefik-net:
    external: true

services:

  dbbackup:
    <<: *default
    image: cuongnb14/db-backup:1.6
    container_name: dbbackup
    # Copy .env.example to .env and fill in real values. Never commit .env.
    env_file:
      - .env
    volumes:
      - ./backup_data:/backup
      - ./config.yaml:/app/config.yaml:ro
