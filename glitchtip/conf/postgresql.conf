# Tuned for a 4GB RAM VM shared with GlitchTip web/worker + Valkey, pls update

# -----------------------------
# Connection Settings
# -----------------------------
listen_addresses = '*'
max_connections = 100

# -----------------------------
# Memory Optimization (~half of a 4GB VM, the rest is left for GlitchTip)
# -----------------------------
shared_buffers = 512MB                # ~12.5% of total RAM
effective_cache_size = 1536MB         # ~37.5% of total RAM
work_mem = 8MB                        # Memory per query sort/hash operation
maintenance_work_mem = 128MB          # Memory for maintenance tasks (vacuum, index)

# -----------------------------
# I/O Optimization (For SSD)
# -----------------------------
random_page_cost = 1.1                # Optimized for SSD (default 4.0 for HDD)
effective_io_concurrency = 200        # Leverages parallel I/O capabilities of SSDs
checkpoint_completion_target = 0.9    # Reduces I/O spikes during checkpoints

# -----------------------------
# Write Ahead Log (WAL)
# -----------------------------
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB

# -----------------------------
# Logging (Critical for Production)
# -----------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_statement = 'none'                # Change to 'ddl' to log structural changes
log_min_duration_statement = 500      # Log queries exceeding 500ms

shared_preload_libraries = 'pg_stat_statements'
