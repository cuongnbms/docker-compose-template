# Based on https://glitchtip.com/assets/compose.sample.yml (GlitchTip 6)
# Create superuser to access django admin (set ENABLE_ADMIN: "True"): exec in web container: ./manage.py createsuperuser
# Add user via admin web without setup email
# Migrations run automatically on startup. Upgrade: docker compose pull && docker compose up -d
# -------------------------------------------------------------------------------------------

x-environment:
  &default-environment
  DATABASE_URL: postgres://${POSTGRES_USER:-glitchtip}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-glitchtip}
  VALKEY_URL: redis://:${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}@valkey:6379 # Or set to blank string to disable
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  EMAIL_URL: consolemail:// # Example smtp://email:password@smtp_url:port https://glitchtip.com/documentation/install#configuration
  GLITCHTIP_DOMAIN: https://${GLITCHTIP_HOST:?set GLITCHTIP_HOST in .env}
  DEFAULT_FROM_EMAIL: email@example.com # Change this to your email
  ENABLE_ADMIN: "False" # Set to True to enable Django Admin at /admin/
  ENABLE_OPENAPI: "False" # Set to True to enable OpenAPI spec at /api/docs
  GLITCHTIP_ENABLE_MCP: "False" # Set to True to enable MCP server
  GLITCHTIP_ENABLE_DUCKDB: "False" # Set to True to enable cold storage archival
  ENABLE_USER_REGISTRATION: "False" # When False, user self-signup is disabled after the first user is registered
  ENABLE_ORGANIZATION_CREATION: "False"
  GLITCHTIP_MAX_EVENT_LIFE_DAYS: 90
  # PORT: 8000 # If changing, change the web service port and traefik label too

  ## To reduce RAM usage (targeting 256-512 MB), consider disabling:
  # VALKEY_URL: "" # Disable Valkey, use Postgres for task queue and cache
  # GLITCHTIP_ENABLE_LOGS: "False" # Disable log ingestion
  # GLITCHTIP_ENABLE_UPTIME: "False" # Disable uptime monitoring

x-depends_on:
  &default-depends_on
  postgres:
    condition: service_healthy
  valkey: # Remove when disabling Valkey
    condition: service_healthy

x-default:
  &default
  networks:
    - traefik-net
  # cpus: 0.5
  # mem_limit: 500M
  restart: unless-stopped
  # init: true
  # privileged: true
  # stdin_open: true
  # tty: true
  logging:
    driver: "json-file"
    options:
      max-size: "10M"
      max-file: "3"

networks:
  traefik-net:
    external: true
  internal: # Private network for the database, not reachable from other stacks on traefik-net

services:
  postgres:
    <<: *default
    image: postgres:18.6
    networks:
      - internal
    stop_grace_period: 1m30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glitchtip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-glitchtip}
    volumes:
      - /data/glitchtip/postgres:/var/lib/postgresql # postgres 18+ stores data under /var/lib/postgresql/<major>/
      - ./conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    shm_size: 1g # Important for PostgreSQL to perform complex queries
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey: # Recommended. Remove this service when disabling Valkey.
    <<: *default
    image: valkey/valkey:9
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$VALKEY_PASSWORD\""] # Required: valkey sits on the shared traefik-net
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    <<: *default
    image: glitchtip/glitchtip:6 # Check https://glitchtip.com/blog/ for new major versions
    depends_on: *default-depends_on
    networks:
      - traefik-net
      - internal
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *default-environment
      SERVER_ROLE: all_in_one # web + background worker + migrations in one container
    volumes:
      - uploads:/code/uploads
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-net
      traefik.http.routers.glitchtip.rule: Host(`${GLITCHTIP_HOST:?set GLITCHTIP_HOST in .env}`)
      traefik.http.routers.glitchtip.entrypoints: https
      traefik.http.routers.glitchtip.tls.certresolver: ssl
      traefik.http.services.glitchtip.loadbalancer.server.port: 8000

volumes:
  uploads:
