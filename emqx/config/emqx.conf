node {
  name = "emqx@127.0.0.1"
  # cookie is injected via EMQX_NODE__COOKIE (see .env). Not set here on purpose.
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
  # default_password is injected via EMQX_DASHBOARD__DEFAULT_PASSWORD (see .env).
  # Applied only on first boot with an empty data volume.
  listeners {
    http.bind = 18083
  }
}

authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
    bootstrap_file = "/opt/emqx/etc/auth-bootstrap-users.csv"
    bootstrap_type = plain
  }
  {
    mechanism = jwt
    use_jwks = false
    algorithm = hmac-based
    # secret is injected via EMQX_AUTHENTICATION__2__SECRET (see .env).
    # The `2` is this authenticator's 1-based position in this list — if you
    # reorder the authenticators above, update that env var index to match.
    secret_base64_encoded = false
    verify_claims {sub = "${username}"}
  }
]

authorization {
  sources = [
    {
      type = file
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
  no_match = deny
  deny_action = disconnect
}
