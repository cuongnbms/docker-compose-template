x-default: &default
  networks:
    - traefik-net
  # cpus: 0.5
  # mem_limit: 500M
  restart: unless-stopped
  # init: true
  # privileged: true
  # stdin_open: true
  # tty: true
  logging:
    driver: "json-file"
    options:
      max-size: "10M"
      max-file: "3"

networks: 
  traefik-net:
    external: true

volumes:
  emqx-data:
  emqx-log:


services:

  emqx:
    << : *default
    image: emqx:5.8
    container_name: emqx
    env_file: .env
    environment:
      # Secrets injected from .env (fail fast if unset). Env vars have the
      # highest precedence and override emqx.conf.
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:?set EMQX_NODE_COOKIE in .env}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?set EMQX_DASHBOARD_PASSWORD in .env}
      # `2` = position of the jwt authenticator in emqx.conf's authentication list.
      EMQX_AUTHENTICATION__2__SECRET: ${EMQX_JWT_SECRET:?set EMQX_JWT_SECRET in .env}
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 12
    ports:
    - "18083:18083" # Admin UI
    - "1883:1883"   # MQTT TCP
    - "8083:8083"   # MQTT WebSocket
    volumes:
    - emqx-data:/opt/emqx/data
    - emqx-log:/opt/emqx/log
    - ./config/emqx.conf:/opt/emqx/etc/emqx.conf:ro
    - ./acl/bootstrap_users.csv:/opt/emqx/etc/auth-bootstrap-users.csv:ro
    - ./acl/acl.conf:/opt/emqx/etc/acl.conf:ro

    labels:
      traefik.enable: true
      traefik.docker.network: traefik-net
      # Dashboard UI (HTTP)
      traefik.http.routers.emqx.rule: Host(`dashboard.example.com`)
      traefik.http.routers.emqx.entrypoints: https
      traefik.http.routers.emqx.tls.certresolver: ssl
      traefik.http.routers.emqx.service: emqx
      traefik.http.services.emqx.loadbalancer.server.port: 18083
      # MQTT over WebSocket (WS upgrade is HTTP → http router; client: wss://ws.example.com/mqtt)
      traefik.http.routers.emqx-ws.rule: Host(`ws.example.com`)
      traefik.http.routers.emqx-ws.entrypoints: https
      traefik.http.routers.emqx-ws.tls.certresolver: ssl
      traefik.http.routers.emqx-ws.service: emqx-ws
      traefik.http.services.emqx-ws.loadbalancer.server.port: 8083
