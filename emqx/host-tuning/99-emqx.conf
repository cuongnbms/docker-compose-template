# EMQX host kernel tuning for production (Linux)
# Deploy: sudo cp 99-emqx.conf /etc/sysctl.d/ && sudo sysctl --system
# Verify: sysctl fs.nr_open net.core.somaxconn net.netfilter.nf_conntrack_max
#
# These are sane starting points, NOT final values. Measure on real load with
# `ss -s` (socket counts), `ss -m` (per-socket memory), conntrack usage, and the
# BEAM's memory before locking anything in.

# --- File descriptors (REQUIRED) ---
# The container's ulimits.nofile (1048576) cannot exceed fs.nr_open, and fs.file-max
# caps every process system-wide. nr_open's default (1048576) EQUALS the ulimit, so
# there is zero headroom until these are raised — keep them above the ulimit.
fs.file-max = 2097152   # often already high on modern kernels; set explicitly
fs.nr_open = 2097152    # per-process FD ceiling (default 1048576 == the ulimit)

# --- Network: listen queue / backlog ---
net.core.somaxconn = 32768
net.ipv4.tcp_max_syn_backlog = 16384
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_syncookies = 1        # SYN-flood protection for a public-facing broker

# --- Network: ephemeral port range ---
# Start high so outbound sockets never collide with a listener/service port on a
# fast restart. Reserve the fixed listener ports as belt-and-suspenders.
net.ipv4.ip_local_port_range = 10000 65535
net.ipv4.ip_local_reserved_ports = 1883,8883,8083,8084,18083

# --- Network: TCP buffers ---
# The `max` is only the autotuning ceiling — idle sockets don't consume it. With
# tens of thousands of slow clients, watch socket memory (`ss -m`) and lower if needed.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# --- Network: TIME_WAIT handling ---
# tcp_tw_reuse only affects OUTBOUND connections (EMQX bridges / webhooks / cluster).
# It does little for inbound persistent MQTT clients — that's expected.
net.ipv4.tcp_max_tw_buckets = 1048576
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1

# --- Network: TCP keepalive (backstop only) ---
# MQTT's own keepalive (PINGREQ/PINGRESP) is the PRIMARY dead-client detector. This
# TCP-level triple is a fallback: ~300s idle + 3*30s probes => dead peer in ~6.5 min
# (vs the default 300s + 9*75s => ~11 min).
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 3

# --- Docker NAT: conntrack (REQUIRED when publishing ports) ---
# Without this, high client counts fill the table -> silently dropped connections
# + "nf_conntrack: table full" in dmesg.
net.netfilter.nf_conntrack_max = 1048576
# The conntrack hash bucket size is NOT reliably writable via sysctl — set it at
# module load (rule of thumb: hashsize ~= nf_conntrack_max / 4):
#   echo 'options nf_conntrack hashsize=262144' | sudo tee /etc/modprobe.d/nf_conntrack.conf
#   sudo modprobe -r nf_conntrack && sudo modprobe nf_conntrack   # or reboot
# For >50k-100k connections, prefer network_mode: host to skip NAT/conntrack
# entirely — but note that removes the container from traefik-net, breaking the
# Traefik WebSocket routing set up in docker-compose.yml.

# --- Memory / swap (stability) ---
vm.swappiness = 1        # avoid swapping out the Erlang VM (latency jitter)
vm.overcommit_memory = 1 # BEAM allocates large virtual memory regions
