# EMQX host kernel tuning for production (Linux)
# Deploy: sudo cp 99-emqx.conf /etc/sysctl.d/ && sudo sysctl --system
# Verify: sysctl fs.nr_open net.core.somaxconn net.netfilter.nf_conntrack_max

# --- File descriptors (REQUIRED) ---
# The container's ulimits.nofile (1048576) is capped by these host limits.
# fs.nr_open must be >= the nofile value set in docker-compose.yml.
# fs.file-max = 2097152 # default: unlimit
# fs.nr_open = 2097152 # default: 1048576

# --- Network: listen queue / backlog ---
net.core.somaxconn = 32768
net.ipv4.tcp_max_syn_backlog = 16384
net.core.netdev_max_backlog = 16384

# --- Network: ephemeral port range (wider for outbound bridge/backend conns) ---
net.ipv4.ip_local_port_range = 1024 65535

# --- Network: TCP buffers ---
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# --- Network: TIME_WAIT handling ---
net.ipv4.tcp_max_tw_buckets = 1048576
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1

# --- Network: keepalive (detect dead connections sooner) ---
net.ipv4.tcp_keepalive_time = 300

# --- Docker NAT: conntrack table (REQUIRED when publishing ports) ---
# Without this, high client counts fill the table -> silently dropped
# connections + "nf_conntrack: table full" in dmesg.
# For >50k-100k connections, consider network_mode: host to skip NAT entirely.
net.netfilter.nf_conntrack_max = 1048576

# --- Memory / swap (stability) ---
vm.swappiness = 1        # avoid swapping out the Erlang VM (latency jitter)
vm.overcommit_memory = 1 # BEAM allocates large virtual memory regions
